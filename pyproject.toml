[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudible"
version = "0.1.0"
description = "Voice interface for Claude Code — STT, TTS with voice cloning, and personality rephrasing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "JayTitus" }]
keywords = ["claude", "voice", "tts", "stt", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "httpx>=0.27",
    "tomli-w>=1.0",
    "click>=8.0",
    "pydantic>=2.0",
    "soundfile>=0.12",
    "platformdirs>=4.0",
    # TTS server
    "TTS>=0.22",
    "transformers>=4.44,<4.45",
    "torchcodec",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "sounddevice>=0.5",
    "numpy>=1.26",
    # STT
    "vosk>=0.3 ; sys_platform == 'linux'",  # legacy nerd-dictation backend (Linux-only wheels)
    "faster-whisper>=1.1",  # whisper streaming backend (cross-platform)
    "onnxruntime>=1.17",  # Silero VAD pre-filter
    # System tray
    "pystray>=0.19",
    "Pillow>=10.0",
    # TUI
    "textual>=0.80",
]

[project.optional-dependencies]
linux = [
    "evdev>=1.7",
    "PyGObject>=3.50",
]
macos = [
    "pynput>=1.7",
    "psutil>=5.9",
]
windows = [
    "pynput>=1.7",
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
claudible = "claudible.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudible"]

[tool.hatch.build]
artifacts = [
    "src/claudible/data/voices/**/*.wav",
    "src/claudible/stt/models/*.onnx",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
